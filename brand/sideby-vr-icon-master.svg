<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">SideBy VR app icon</title>
  <desc id="desc">Two cyan side-by-side lenses on a deep navy background.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="74%">
      <stop offset="0" stop-color="#102b31"/>
      <stop offset="0.58" stop-color="#071417"/>
      <stop offset="1" stop-color="#040a0d"/>
    </radialGradient>
    <linearGradient id="leftLens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8fffa"/>
      <stop offset="0.42" stop-color="#75e6e3"/>
      <stop offset="1" stop-color="#20c9c3"/>
    </linearGradient>
    <linearGradient id="rightLens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75e6e3"/>
      <stop offset="0.55" stop-color="#3ca9c7"/>
      <stop offset="1" stop-color="#167da3"/>
    </linearGradient>
    <filter id="lensGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)"/>
  <circle cx="512" cy="512" r="338" fill="none" stroke="#75e6e3" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="512" cy="512" r="286" fill="none" stroke="#75e6e3" stroke-opacity="0.04" stroke-width="2"/>

  <g filter="url(#lensGlow)">
    <path d="M254 278H482L440 746H212Z" fill="url(#leftLens)"/>
    <path d="M542 278H770L728 746H500Z" fill="url(#rightLens)"/>
  </g>
  <path d="M271 302H457L452 358H266Z" fill="#ffffff" fill-opacity="0.22"/>
  <path d="M559 302H745L740 358H554Z" fill="#ffffff" fill-opacity="0.14"/>
</svg>
